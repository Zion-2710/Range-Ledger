<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root {
    --bg: #F3ECD9; --ink: #FDFAF1; --paper: #2B2116; --paper-dim: #8A7C5E;
    --brass: #A9791E; --olive: #5F7043; --forest: #3F7A52; --rust: #B5432B;

  body { margin: 0; background: var(--bg); font-family: 'IBM Plex Sans', sans-serif; color: var(--paper); position: relative; }

  .bg-target {

      radial-gradient(circle at 18% 22%, rgba(43,33,22,0.28) 0 3px, transparent 3px 4.5px),
      radial-gradient(circle at 83% 16%, rgba(43,33,22,0.24) 0 2.5px, transparent 2.5px 4px),
      radial-gradient(circle at 72% 82%, rgba(43,33,22,0.26) 0 3px, transparent 3px 4.5px),
      radial-gradient(circle at 10% 78%, rgba(43,33,22,0.22) 0 2.5px, transparent 2.5px 4px),
      radial-gradient(circle at 90% 58%, rgba(43,33,22,0.24) 0 2.5px, transparent 2.5px 4px),
      radial-gradient(circle at 50% 34%, rgba(181,67,43,0.55) 0 7px, transparent 7px 8px),
      repeating-radial-gradient(circle at 50% 34%, rgba(181,67,43,0.20) 0px, rgba(181,67,43,0.20) 3px, transparent 3px, transparent 42px),
      repeating-radial-gradient(circle at 50% 34%, rgba(43,33,22,0.06) 0px, rgba(43,33,22,0.06) 1px, transparent 1px, transparent 42px);
  }
  .phone { position: relative; z-index: 1; }

  .config-banner { background: #B5432B; color: #fff; font-size: 12px; padding: 10px 16px; text-align: center; font-family: 'IBM Plex Mono', monospace; position: relative; z-index: 2; }
  .load-error-banner { background: rgba(181,67,43,0.12); border: 1px solid var(--rust); color: var(--rust); border-radius: 6px; padding: 10px 12px; font-size: 12px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
  .load-error-banner button { font-family: 'Oswald', sans-serif; text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.04em; background: none; border: 1px solid var(--rust); color: var(--rust); border-radius: 5px; padding: 4px 8px; cursor: pointer; }
  .config-banner code { background: rgba(0,0,0,0.25); padding: 1px 5px; border-radius: 3px; }

  .phone {
    width: 100%; max-width: 100%; margin: 0; border: none; border-radius: 0; overflow: hidden;
    box-shadow: none; background: var(--bg); min-height: 100vh;
  }
  .status-bar { display: flex; justify-content: space-between; padding: 8px 18px 0; font-size: 11px; color: var(--paper-dim); font-family: 'IBM Plex Mono', monospace; }

  .eyebrow { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.08em; font-size: 11.5px; color: var(--paper-dim); }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 10px; }

  .app-topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .screen-pad { padding: 16px; }
  .splash { padding: 50px 20px 20px; position: relative; overflow: hidden; }
  .target-watermark::before {
    content: ''; position: absolute; top: -70px; left: 50%; transform: translateX(-50%);
    width: 360px; height: 360px; border-radius: 50%; pointer-events: none;
    background:
      radial-gradient(circle, rgba(181,67,43,0.55) 0 6px, transparent 6px 7px),
      repeating-radial-gradient(circle, rgba(181,67,43,0.22) 0px, rgba(181,67,43,0.22) 3px, transparent 3px, transparent 30px);
  }
  .target-watermark > * { position: relative; z-index: 1; }
  .brand-center { text-align: center; }
  .pulse-loading { animation: pulseFade 1.4s ease-in-out infinite; }
  @keyframes pulseFade { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .brand-title { font-family: 'Oswald', sans-serif; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; }
  .brand-sub { font-size: 12px; color: var(--paper-dim); margin-top: 2px; }

  .auth-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .auth-tab { flex: 1; text-align: center; padding: 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--ink); color: var(--paper-dim); font-family: 'Oswald', sans-serif; text-transform: uppercase; font-size: 11.5px; letter-spacing: 0.05em; cursor: pointer; }
  .auth-tab.active { border-color: var(--brass); color: var(--brass); font-weight: 600; }

  .role-card { display: flex; align-items: center; gap: 12px; width: 100%; background: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 10px; color: var(--paper); cursor: pointer; text-align: left; }
  .role-card:hover { border-color: var(--brass); }

  .field-label { display: block; font-size: 11px; color: var(--paper-dim); margin: 10px 0 4px; font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
  .text-input { width: 100%; background: var(--ink); border: 1px solid var(--line); color: var(--paper); border-radius: 6px; padding: 9px 10px; font-size: 13px; font-family: 'IBM Plex Sans', sans-serif; }
  select.text-input { appearance: none; }

  .btn-brass { background: var(--brass); color: var(--ink); border: none; font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; font-size: 11.5px; font-weight: 600; padding: 10px 14px; border-radius: 5px; cursor: pointer; width: 100%; }
  .btn-brass:hover { filter: brightness(1.08); }
  .btn-brass:disabled { opacity: 0.6; cursor: default; }

  .icon-btn { background: var(--ink); border: 1px solid var(--line); border-radius: 8px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; color: var(--paper-dim); cursor: pointer; position: relative; }
  .icon-btn.small { width: 26px; height: 26px; }
  .dot-badge { position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; border-radius: 50%; background: var(--brass); border: 1.5px solid var(--bg); }

  .popover { position: absolute; top: 42px; right: 0; width: 250px; background: var(--ink); border: 1px solid var(--brass); border-radius: 8px; padding: 12px; z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .popover.cal-popover { width: 292px; }
  .popover-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .reminder-list { display: flex; flex-direction: column; gap: 2px; max-height: 150px; overflow: auto; }
  .reminder-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .reminder-row:last-child { border-bottom: none; }

  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 9.5px; color: var(--paper-dim); margin-bottom: 4px; font-family: 'IBM Plex Mono', monospace; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 4px; }
  .cal-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 5px; cursor: pointer; font-size: 10.5px; font-family: 'IBM Plex Mono', monospace; color: var(--paper); }
  .cal-cell:hover { background: rgba(201,162,75,0.14); }
  .cal-cell.empty { cursor: default; visibility: hidden; }
  .cal-cell.today { border: 1px solid var(--brass); }
  .cal-cell.selected { background: var(--brass); color: var(--ink); font-weight: 600; }
  .cal-dots { display: flex; gap: 2px; margin-top: 1px; height: 4px; }
  .cal-dot { width: 4px; height: 4px; border-radius: 50%; }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 6px 10px; margin: 8px 0; padding-top: 8px; border-top: 1px dashed var(--line); }
  .elig-badge { display: inline-block; font-family: 'Oswald', sans-serif; font-size: 8.5px; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600; color: var(--elig-color); border: 1px solid var(--elig-color); border-radius: 3px; padding: 1px 5px; }
  .legend-item { display: flex; align-items: center; gap: 4px; font-size: 9px; color: var(--paper-dim); }
  .legend-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 30; padding: 20px; }
  .modal-card { background: var(--ink); border: 1px solid var(--brass); border-radius: 10px; padding: 18px; width: 100%; max-width: 300px; max-height: 640px; overflow-y: auto; }
  .receipt-card { background: repeating-linear-gradient(var(--ink), var(--ink) 27px, var(--line-soft) 27px, var(--line-soft) 28px); }
  .receipt-row { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; padding: 4px 0; }
  .receipt-row span:first-child { color: var(--paper-dim); }
  .pay-option { width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--line); color: var(--paper); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .pay-option:hover { border-color: var(--brass); }

  .card { background: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .stat-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .statcard { background: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
  .statcard-icon { width: 30px; height: 30px; border-radius: 6px; background: rgba(201,162,75,0.12); color: var(--brass); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .statcard-value { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 16px; }
  .fee-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fee-card { display: flex; align-items: center; gap: 8px; padding: 12px; }

  .mono-lg { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 20px; margin-bottom: 4px; }
  .mono-sm { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--brass); }
  .detail-name { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 17px; }

  .toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .chip { font-family: 'Oswald', sans-serif; font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--ink); color: var(--paper-dim); cursor: pointer; }
  .chip-active { border-color: var(--brass); color: var(--brass); }

  .stamp { display: inline-flex; align-items: center; gap: 5px; font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 0.07em; font-weight: 600; color: var(--stamp-color); border: 1.5px solid var(--stamp-color); padding: 3px 8px 3px 6px; border-radius: 3px; transform: rotate(-3deg); position: relative; }
  .stamp::before { content: ''; position: absolute; inset: -3px; border: 1px solid var(--stamp-color); opacity: 0.35; border-radius: 4px; pointer-events: none; }

  .logbook { display: flex; flex-direction: column; }
  .analysis-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 10px 0; padding: 8px; background: var(--line-soft); border-radius: 6px; }
  .analysis-cell { text-align: center; }
  .log-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .log-row:last-child { border-bottom: none; }

  .ledger { width: 100%; border-collapse: collapse; }
  .ledger th { text-align: left; font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; font-size: 9.5px; color: var(--paper-dim); padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .ledger td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); font-size: 12px; }

  .mini-bar { width: 60px; height: 6px; background: var(--line-soft); border-radius: 3px; overflow: hidden; }

  .back-btn { display: flex; align-items: center; gap: 4px; background: none; border: none; color: var(--paper-dim); font-size: 12px; cursor: pointer; margin-bottom: 10px; padding: 0; }

  .avatar-fallback { border-radius: 50%; background: var(--olive); color: var(--ink); display: flex; align-items: center; justify-content: center; font-family: 'Oswald', sans-serif; font-weight: 600; border: 1.5px solid var(--brass); }

  /* Toasts */
  .toast-stack { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; width: min(340px, calc(100% - 28px)); pointer-events: none; }
  .toast { pointer-events: auto; background: var(--ink); border: 1px solid var(--line); border-left: 4px solid var(--brass); border-radius: 7px; padding: 10px 12px; font-size: 12.5px; box-shadow: 0 10px 28px rgba(43,33,22,0.22); display: flex; align-items: flex-start; gap: 8px; animation: toast-in 0.25s ease; }
  .toast.success { border-left-color: var(--forest); }
  .toast.error { border-left-color: var(--rust); }
  .toast-close { background: none; border: none; color: var(--paper-dim); cursor: pointer; padding: 0; margin-left: auto; flex-shrink: 0; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

  /* Loading screen */
  .loading-crosshair { animation: pulse-fade 1.6s ease-in-out infinite; }
  @keyframes pulse-fade { 0%, 100% { opacity: 0.45; transform: scale(0.94); } 50% { opacity: 1; transform: scale(1); } }

  /* Photo upload */
  .photo-upload { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .photo-upload-btn { display: flex; align-items: center; gap: 6px; background: var(--ink); border: 1px dashed var(--line); color: var(--paper-dim); border-radius: 6px; padding: 10px 12px; font-size: 12px; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
  .photo-upload-btn:hover { border-color: var(--brass); color: var(--brass); }

  /* Password visibility toggle */
  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 36px; }
  .password-toggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--paper-dim); cursor: pointer; padding: 4px; display: flex; }
  .password-toggle:hover { color: var(--brass); }

  /* General interactivity polish */
  .btn-brass, .chip, .role-card, .pay-option, .icon-btn, .photo-upload-btn { transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease, filter 0.12s ease; }
  .btn-brass:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(169,121,30,0.3); }
  .btn-brass:active:not(:disabled) { transform: translateY(0); }
  .role-card:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(43,33,22,0.08); }
  .card { transition: box-shadow 0.15s ease; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .role-card:focus-visible {
    outline: 2px solid var(--brass); outline-offset: 1px;
  }
  .modal-card { animation: modal-in 0.18s ease; }
  @keyframes modal-in { from { opacity: 0; transform: translateY(6px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  ::selection { background: rgba(169,121,30,0.25); }

  .dashboard-grid { display: flex; flex-direction: column; gap: 12px; }
  .dashboard-grid .span-2 { }
  .score-views { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; }
  .score-panel { min-width: 0; }
  .score-views .score-panel:nth-child(2) { border-left: 1px dashed var(--line); padding-left: 10px; }

  @media (min-width: 860px) {
    body { background: #E7DBB9; padding: 40px 24px; }
    .phone { max-width: 1180px; margin: 0 auto; border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 30px 80px rgba(43,33,22,0.20); min-height: 82vh; overflow: hidden; }
    .app-topbar { padding: 20px 48px; }
    .screen-pad { padding: 30px 48px 48px; }
    .splash { max-width: 480px; margin: 0 auto; padding: 80px 20px 20px; }
    .card { padding: 20px 24px; }
    .detail-name { font-size: 20px; }
    .mono-lg { font-size: 24px; }
    .eyebrow { font-size: 12px; }
    .role-card { padding: 18px 20px; }
    .stat-row-2 { grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .fee-grid-2 { grid-template-columns: repeat(2, minmax(230px, 1fr)); max-width: 560px; }
    .ledger th, .ledger td { padding: 12px 18px; font-size: 13px; }
    .popover.cal-popover { width: 320px; }
    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    .dashboard-grid .span-2 { grid-column: 1 / -1; }
    .score-views { gap: 20px; }
    .score-views .score-panel:nth-child(2) { padding-left: 20px; }
    .analysis-grid { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>

function formatDate(iso) { const d = new Date(iso + 'T00:00:00'); return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }); }
function daysUntil(iso) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const target = new Date(iso + 'T00:00:00');
  const diff = Math.round((target - today) / 86400000);
  if (diff === 0) return 'Today'; if (diff === 1) return 'Tomorrow'; if (diff < 0) return Math.abs(diff) + 'd ago';
  return 'in ' + diff + 'd';
}

async function boot() {
  if (!CONFIGURED || !sb) { state.screen = 'AUTH'; render(); return; }
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  if (state.session) {
    await fetchProfile();
    if (state.profile) { await routeAfterAuth(); return; }
  }
  state.screen = 'AUTH';
  render();
}
async function fetchProfile() {
  const { data } = await sb.from('profiles').select('*').eq('id', state.session.user.id).single();
  state.profile = data;
}
async function routeAfterAuth() {
  if (state.profile.role === 'student') {
    const { data, error } = await sb.from('students').select('*').eq('id', state.profile.id).single();
    if (error) { alert('Signed in, but could not load your student record: ' + error.message + ' (if this is a test account from before a recent fix, ask whoever manages the database to run the backfill migration.)'); }
    state.me = data;
    await enterStudentDashboard();
  } else if (state.profile.role === 'coach') {
    const { data, error } = await sb.from('coaches').select('*').eq('id', state.profile.id).single();
    if (error) { alert('Signed in, but could not load your coach record: ' + error.message + ' (if this is a test account from before a recent fix, ask whoever manages the database to run the backfill migration.)'); }
    state.me = data;
    await enterCoachDashboard();
  } else {
    await enterAdminDashboard();
  }
}

async function submitSignUp() {
  const role = document.getElementById('suRole').value;
  const name = document.getElementById('suName').value.trim();
  const email = document.getElementById('suEmail').value.trim();
  const password = document.getElementById('suPassword').value;
  if (!name || !email || !password) { alert('Please fill in your name, email, and password.'); return; }
  if (password.length < 6) { alert('Password must be at least 6 characters.'); return; }

  let phone = '', category = '', shooterCategory = '', specialization = '', academyName = '', academyAddress = '', laneReservation = 'false';
  if (role === 'student') {
    phone = document.getElementById('suPhone').value.trim();
    category = document.getElementById('suWeapon').value;
    shooterCategory = document.getElementById('suShooterCategory').value;
    if (!phone) { alert('Please enter your mobile number.'); return; }
  } else if (role === 'coach') {
    specialization = document.getElementById('suSpecialization').value;
    academyName = document.getElementById('suAcademyName').value.trim();
    academyAddress = document.getElementById('suAcademyAddress').value.trim();
    laneReservation = document.getElementById('suLaneReservation').value;
    if (!academyName) { alert('Please enter your academy\'s name.'); return; }
  }

  setBusy(true); render();
  // These extra fields ride along as auth metadata, so the database trigger
  // (see migration 20260101000001) can create the profiles/students/coaches
  // row immediately — even if your project requires email confirmation and
  // there's no active session yet to run a normal insert with.
  const { data: signUpData, error: signUpErr } = await sb.auth.signUp({
    email, password,
    options: { data: { role, name, phone, category, shooter_category: shooterCategory, specialization, academy_name: academyName, academy_address: academyAddress, lane_reservation: laneReservation } },
  });
  if (signUpErr) { setBusy(false); render(); alert('Sign up failed: ' + signUpErr.message); return; }
  const user = signUpData.user;
  if (!user || !signUpData.session) {
    setBusy(false); state.authTab = 'signin'; state.screen = 'AUTH'; render();
    alert('Account created. Your profile is saved. If email confirmation is required on your Supabase project, check your inbox, then sign in.');
    return;
  }

  // Photo upload needs an active session, so it only happens here (not in
  // the trigger). The row itself was already created by the trigger — this
  // just fills in the photo afterward.
  if (role === 'student' && state.pendingPhotoFile) {
    const path = user.id + '/' + Date.now() + '-' + state.pendingPhotoFile.name;
    const { error: upErr } = await sb.storage.from('avatars').upload(path, state.pendingPhotoFile);
    if (upErr) {
      alert('Account created, but the photo upload failed: ' + upErr.message + ' (you can skip this or try again later.)');
    } else {
      const { data: pub } = sb.storage.from('avatars').getPublicUrl(path);
      const { error: photoErr } = await sb.from('students').update({ photo_url: pub.publicUrl }).eq('id', user.id);
      if (photoErr) alert('Account created, but saving the photo failed: ' + photoErr.message);
    }
  }

  state.session = signUpData.session;
  state.profile = { id: user.id, role, name };
  setBusy(false);
  await routeAfterAuth();
}
async function submitSignIn() {
  const email = document.getElementById('siEmail').value.trim();
  const password = document.getElementById('siPassword').value;
  if (!email || !password) { alert('Please enter your email and password.'); return; }
  setBusy(true); render();
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { setBusy(false); render(); alert('Sign in failed: ' + error.message); return; }
  state.session = data.session;
  await fetchProfile();
  setBusy(false);
  await routeAfterAuth();
}
async function logout() {
  if (supabase) await sb.auth.signOut();
  state.session = null; state.profile = null; state.me = null;
  state.scoresByStudent = {}; state.cache = { students: [], coaches: [], reminders: [], invoices: [], attendanceRequests: [], inventory: [] };

function ringGauge(percent, size) {
  size = size || 74;
  const stroke = 7, r = (size - stroke) / 2, c = 2 * Math.PI * r, offset = c - (percent / 100) * c;

    '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:\'IBM Plex Mono\',monospace;font-weight:600;font-size:' + Math.round(size * 0.22) + 'px;color:var(--paper)">' + percent + '%</div></div>';

function lineChartSvg(data, max, yFloor) {
  const w = 272, h = 130, padL = 34, padB = 20, padT = 8, padR = 8;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const xStep = innerW / (data.length - 1 || 1);
  const scaleY = (v) => padT + innerH - ((v - yFloor) / (max - yFloor)) * innerH;
  const points = data.map((d, i) => (padL + i * xStep) + ',' + scaleY(d.score)).join(' ');
  const gridLines = [0, 0.5, 1].map((f) => { const y = padT + innerH * f; return '<line x1="' + padL + '" y1="' + y + '" x2="' + (w - padR) + '" y2="' + y + '" stroke="var(--line-soft)" stroke-dasharray="2 4"/>'; }).join('');
  const dots = data.map((d, i) => '<circle cx="' + (padL + i * xStep) + '" cy="' + scaleY(d.score) + '" r="3" fill="var(--brass)"/>').join('');
  const labels = data.map((d, i) => '<text x="' + (padL + i * xStep) + '" y="' + (h - 4) + '" font-size="10" fill="var(--paper-dim)" text-anchor="middle" font-family="IBM Plex Mono">' + d.session + '</text>').join('');
  if (data.length === 0) return '';
  return '<svg width="100%" viewBox="0 0 ' + w + ' ' + h + '" style="overflow:visible">' + gridLines + '<polyline points="' + points + '" fill="none" stroke="var(--brass)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' + dots + labels + '</svg>';
}
function performanceAnalysis(data, max) {
  if (data.length < 2) return null;
  const scores = data.map((d) => d.score);
  const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
  const best = Math.max(...scores);
  const mid = Math.floor(scores.length / 2);
  const firstHalf = scores.slice(0, mid || 1), secondHalf = scores.slice(mid || 1);
  const firstAvg = firstHalf.reduce((a, b) => a + b, 0) / firstHalf.length;
  const secondAvg = secondHalf.length ? secondHalf.reduce((a, b) => a + b, 0) / secondHalf.length : firstAvg;
  const diff = secondAvg - firstAvg;
  let trend, trendColor;
  if (diff > max * 0.015) { trend = 'Improving ↑'; trendColor = 'var(--forest)'; }
  else if (diff < -max * 0.015) { trend = 'Declining ↓'; trendColor = 'var(--rust)'; }
  else { trend = 'Steady →'; trendColor = 'var(--brass)'; }
  const variance = scores.reduce((a, b) => a + Math.pow(b - avg, 2), 0) / scores.length;
  const stdDev = Math.sqrt(variance);
  const consistency = stdDev < max * 0.03 ? 'Very consistent' : stdDev < max * 0.06 ? 'Some variation' : 'High variation';
  return { avg, best, trend, trendColor, consistency };
}
function scorePanel(studentId, mode, allowLogging) {
  const shots = Number(state.chartMatchType);
  const max = mode === 'decimal' ? MAX_DECIMAL[shots] : MAX_INTEGER[shots];
  const perShot = mode === 'decimal' ? 10.9 : 10;
  const data = scoresFor(studentId, shots, mode);
  const fmt = (v) => mode === 'decimal' ? v.toFixed(1) : Math.round(v);
  const yFloor = mode === 'decimal' ? Math.round(max * 0.4 * 10) / 10 : Math.round(max * 0.4);
  const analysis = performanceAnalysis(data, max);
  const label = mode === 'decimal' ? 'Decimal scoring (10.9/shot)' : 'Whole scoring (10.0/shot)';
  return '<div class="score-panel"><div class="eyebrow" style="margin-bottom:8px">' + label + '</div>' +
    '<div style="font-size:10.5px;color:var(--paper-dim);margin-bottom:8px">Max for ' + state.chartMatchType + ' shots: <span class="mono-sm" style="color:var(--paper)">' + max.toFixed(1) + '</span> (' + perShot + ' pts/shot)</div>' +
    (data.length === 0 ? '<div style="text-align:center;padding:20px 0;color:var(--paper-dim);font-size:11.5px;border:1px dashed var(--line);border-radius:6px">No sessions logged yet.' + (allowLogging ? '<br/>Add your first score below.' : '') + '</div>' :
    lineChartSvg(data, max, yFloor) +
    (analysis ? '<div class="analysis-grid"><div class="analysis-cell"><div class="mono-sm" style="font-size:13px;color:var(--paper)">' + fmt(analysis.avg) + '</div><div class="eyebrow" style="font-size:9px">Average</div></div>' +
      '<div class="analysis-cell"><div class="mono-sm" style="font-size:13px;color:var(--paper)">' + fmt(analysis.best) + '</div><div class="eyebrow" style="font-size:9px">Best</div></div>' +
      '<div class="analysis-cell"><div class="mono-sm" style="font-size:13px;color:' + analysis.trendColor + '">' + analysis.trend + '</div><div class="eyebrow" style="font-size:9px">Trend</div></div>' +
      '<div class="analysis-cell"><div class="mono-sm" style="font-size:11.5px;color:var(--paper)">' + analysis.consistency + '</div><div class="eyebrow" style="font-size:9px">Consistency</div></div></div>'
      : '<div style="font-size:10.5px;color:var(--paper-dim);margin:6px 0">Log at least 2 sessions to see your performance analysis.</div>') +
    '<div class="logbook" style="margin-top:10px">' + data.slice().reverse().map((s) => '<div class="log-row"><span class="mono-sm">' + s.session + '</span><span style="font-size:11.5px;flex:1">' + state.chartMatchType + '-shot match — scored ' + fmt(s.score) + '</span><span class="mono-sm" style="color:var(--paper-dim)">Present</span></div>').join('') + '</div>') +
    (allowLogging ? '<div style="margin-top:12px;border-top:1px dashed var(--line);padding-top:10px"><div class="eyebrow" style="margin-bottom:6px">Log a session score</div>' +
      '<div style="font-size:10.5px;color:var(--paper-dim);margin-bottom:6px">Enter your ' + state.chartMatchType + '-shot score out of ' + max.toFixed(1) + '</div>' +
      '<input id="sessionScoreInput_' + mode + '" class="text-input" type="number" step="0.1" min="0" max="' + max + '" placeholder="e.g. ' + (max * 0.75).toFixed(1) + '" style="margin-bottom:8px"/>' +
      '<button class="btn-brass" onclick="logSessionScore(\'' + mode + '\')">Add session</button></div>' : '') + '</div>';
}

async function logSessionScore(mode) {
  const input = document.getElementById('sessionScoreInput_' + mode);
  const val = parseFloat(input.value);
  const shots = Number(state.chartMatchType);
  const max = mode === 'decimal' ? MAX_DECIMAL[shots] : MAX_INTEGER[shots];
  if (isNaN(val) || val < 0 || val > max) { alert('Please enter a score between 0 and ' + max.toFixed(1) + '.'); return; }
  const scoreVal = mode === 'decimal' ? Math.round(val * 10) / 10 : Math.round(val);
  const existing = scoresFor(state.me.id, shots, mode);
  await sb.from('match_scores').insert({ student_id: state.me.id, shots, mode, session_label: 'M' + (existing.length + 1), score: scoreVal });

// Calendar
function typeColor(type) { return TYPE_COLORS[type] || 'var(--brass)'; }

let lastCalWheelTime = 0;
function handleCalWheel(e) {
  e.preventDefault();
  const now = Date.now();
  if (now - lastCalWheelTime < 220) return;
  lastCalWheelTime = now;
  if (e.deltaY > 0) shiftCalendarMonth(1); else if (e.deltaY < 0) shiftCalendarMonth(-1);
}
function shiftCalendarMonth(delta) {
  let year = state.calendarViewDate.year, month = state.calendarViewDate.month + delta;
  if (month < 0) { month = 11; year--; } if (month > 11) { month = 0; year++; }
  state.calendarViewDate = { year, month }; render();
}

function monthCalendar() {
  const year = state.calendarViewDate.year, month = state.calendarViewDate.month;
  const firstDay = new Date(year, month, 1); const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const monthName = firstDay.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
  const remindersByDay = {};
  state.cache.reminders.forEach((r) => {
    const d = new Date(r.date + 'T00:00:00');
    if (d.getFullYear() === year && d.getMonth() === month) { remindersByDay[d.getDate()] = remindersByDay[d.getDate()] || []; remindersByDay[d.getDate()].push(r); }
  });
  const todayIso = new Date().toISOString().slice(0, 10);
  let cells = '';
  for (let i = 0; i < startWeekday; i++) cells += '<div class="cal-cell empty">·</div>';
  for (let day = 1; day <= daysInMonth; day++) {
    const iso = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
    const dots = (remindersByDay[day] || []).slice(0, 3).map((r) => '<span class="cal-dot" style="background:' + typeColor(r.type) + '"></span>').join('');
    cells += '<div class="cal-cell' + (iso === todayIso ? ' today' : '') + (state.selectedReminderDate === iso ? ' selected' : '') + '" onclick="selectCalendarDate(\'' + iso + '\')"><span>' + day + '</span><div class="cal-dots">' + dots + '</div></div>';
  }
  return '<div onwheel="handleCalWheel(event)" title="Scroll to change month"><div class="cal-nav"><button class="icon-btn small" onclick="shiftCalendarMonth(-1)">' + icon('chevronLeft', 12) + '</button>' +
    '<span class="eyebrow" style="font-size:11px">' + monthName + '</span><button class="icon-btn small" onclick="shiftCalendarMonth(1)">' + icon('chevronRight', 12) + '</button></div>' +
    '<div class="cal-weekdays">' + ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((d) => '<div>' + d + '</div>').join('') + '</div><div class="cal-grid">' + cells + '</div>' +
    '<div style="font-size:8.5px;color:var(--paper-dim);text-align:center;margin-top:3px">scroll ↑ ↓ to change month</div></div>';
}

async function generateInvoice(student, method) {
  const invoiceNumber = 'INV-' + String(student.id).slice(0, 8).toUpperCase() + '-' + Date.now().toString().slice(-6);

  // Find the coach teaching this student's weapon category, for academy
  // branding and lane info on the invoice (best-effort — falls back to
  // generic branding if no coach has signed up for that category yet).
  const { data: coachMatch } = await sb.from('coaches').select('*').eq('specialization', student.category).limit(1).maybeSingle();

  // Any inventory items this coach has issued to the student but not yet billed.
  let pendingIssues = [];
  if (coachMatch) {
    const { data: issues } = await sb.from('inventory_issues').select('*').eq('student_id', student.id).eq('invoiced', false);
    pendingIssues = issues || [];
  }

  const fee = CATEGORIES[student.category].fee;
  const items = [{ description: 'Shooting Training Coaching Fee', qty: 1, rate: fee, amount: fee }];
  pendingIssues.forEach((iss) => {
    items.push({ description: iss.item_name, qty: iss.quantity, rate: Number(iss.unit_price), amount: iss.quantity * Number(iss.unit_price) });
  });
  const total = items.reduce((sum, it) => sum + it.amount, 0);

  const { data } = await sb.from('invoices').insert({
    invoice_number: invoiceNumber, student_id: student.id, student_name: student.name,
    email: student.email, category: student.category, amount: total, method,
    items, batch: student.batch,
    academy_name: coachMatch && coachMatch.academy_name ? coachMatch.academy_name : 'Range Ledger',
    academy_address: coachMatch ? coachMatch.academy_address : null,
    lane: coachMatch && coachMatch.lane_reservation ? 'Reserved' : null,
  }).select().single();

  if (pendingIssues.length && data) {
    await sb.from('inventory_issues').update({ invoiced: true, invoice_id: data.id }).eq('student_id', student.id).eq('invoiced', false);
  }
  return data;
}

async function submitInventoryAdd() {
  const name = document.getElementById('invItemName').value.trim();
  const qty = parseInt(document.getElementById('invItemQty').value, 10);
  const price = parseFloat(document.getElementById('invItemPrice').value) || 0;
  if (!name) { alert('Please enter an item name.'); return; }
  if (!qty || qty <= 0) { alert('Please enter a quantity greater than 0.'); return; }
  const existing = state.cache.inventory.find((i) => i.name.trim().toLowerCase() === name.toLowerCase());
  if (existing) {
    const { error } = await sb.from('inventory_items').update({ quantity: existing.quantity + qty, unit_price: price || existing.unit_price, updated_at: new Date().toISOString() }).eq('id', existing.id);
    if (error) { alert('Could not update inventory: ' + error.message); return; }
  } else {
    const { error } = await sb.from('inventory_items').insert({ coach_id: state.me.id, name, quantity: qty, unit_price: price });
    if (error) { alert('Could not add item: ' + error.message); return; }
  }
  await fetchInventory(state.me.id);
  document.getElementById('invItemName').value = ''; document.getElementById('invItemQty').value = ''; document.getElementById('invItemPrice').value = '';
  render();
}

async function submitIssueItem(itemId) {
  const studentId = document.getElementById('issueStudentSelect_' + itemId).value;
  const qty = parseInt(document.getElementById('issueQty_' + itemId).value, 10);
  const item = state.cache.inventory.find((i) => i.id === itemId);
  if (!studentId) { alert('Please choose a student.'); return; }
  if (!qty || qty <= 0) { alert('Please enter a quantity greater than 0.'); return; }
  if (!item || qty > item.quantity) { alert('Not enough stock — only ' + (item ? item.quantity : 0) + ' left.'); return; }
  const { error: issueErr } = await sb.from('inventory_issues').insert({
    coach_id: state.me.id, student_id: studentId, item_name: item.name, quantity: qty, unit_price: item.unit_price,
  });
  if (issueErr) { alert('Could not issue item: ' + issueErr.message); return; }
  const { error: updateErr } = await sb.from('inventory_items').update({ quantity: item.quantity - qty }).eq('id', itemId);
  if (updateErr) { alert('Item was issued, but updating stock failed: ' + updateErr.message); }
  state.issueFormItemId = null;
  await fetchInventory(state.me.id);
  render();
}

async function submitEmailChange() {
  const oldEmail = document.getElementById('oldEmailInput').value.trim();
  const newEmail = document.getElementById('newEmailInput').value.trim();
  if (!oldEmail || !newEmail) { alert('Please fill in both your current and new email.'); return; }
  const currentEmail = (state.session && state.session.user && state.session.user.email) || '';
  if (oldEmail.toLowerCase() !== currentEmail.toLowerCase()) { alert('That doesn\'t match the email on your account.'); return; }
  if (!newEmail.includes('@')) { alert('Please enter a valid new email address.'); return; }
  const { error } = await sb.auth.updateUser({ email: newEmail });
  if (error) { alert('Could not update email: ' + error.message); return; }
  alert('Check your inbox to confirm the email change.');
  state.accountForm = null; state.accountMenuOpen = false; render();
}
async function submitPasswordChange() {
  const oldPassword = document.getElementById('oldPasswordInput').value;
  const newPassword = document.getElementById('newPasswordInput').value;
  if (!oldPassword || !newPassword) { alert('Please fill in both your current and new password.'); return; }
  if (newPassword.length < 6) { alert('New password must be at least 6 characters.'); return; }
  const { error } = await sb.auth.updateUser({ password: newPassword, current_password: oldPassword });
  if (error) { alert('Could not update password: ' + error.message); return; }
  alert('Password updated.');
  state.accountForm = null; state.accountMenuOpen = false; render();
}

function screenAdminDashboard() {
  const students = state.cache.students;
  const dueOrOverdue = students.filter((s) => s.fee_status !== 'PAID');
  const totalRevenue = students.filter((s) => s.fee_status === 'PAID').reduce((sum, s) => sum + CATEGORIES[s.category].fee, 0);
  const avgAttendance = students.length ? Math.round(students.reduce((sum, s) => sum + s.attendance, 0) / students.length) : 0;
  return '<div class="app-topbar"><div style="display:flex;align-items:center;gap:8px">' + icon('crosshair', 22, 'var(--brass)') +
    '<div><div style="font-weight:600;font-size:13px">Admin</div><div style="font-size:10px;color:var(--paper-dim)">Full academy overview</div></div></div>' +
    '<div style="display:flex;align-items:center;gap:6px"><div style="position:relative">' + calendarButton() + calendarPopover() + '</div><div style="position:relative">' + accountMenuButton() + accountMenuPopover() + '</div>' + logoutButton() + '</div></div>' +
    '<div class="screen-pad">' + loadErrorBanner() + '<div class="stat-row-2">' +
    '<div class="statcard"><div class="statcard-icon">' + icon('user', 15) + '</div><div><div class="statcard-value">' + students.length + '</div><div class="eyebrow">Students</div></div></div>' +
    '<div class="statcard"><div class="statcard-icon">' + icon('rupee', 15) + '</div><div><div class="statcard-value">₹' + totalRevenue.toLocaleString('en-IN') + '</div><div class="eyebrow">Revenue</div></div></div>' +
    '<div class="statcard"><div class="statcard-icon">' + icon('bell', 15) + '</div><div><div class="statcard-value">' + dueOrOverdue.length + '</div><div class="eyebrow">Dues</div></div></div>' +
    '<div class="statcard"><div class="statcard-icon">' + icon('calendar', 15) + '</div><div><div class="statcard-value">' + avgAttendance + '%</div><div class="eyebrow">Avg attend.</div></div></div></div>' +
    '<div class="dashboard-grid" style="margin:14px 0">' +
    '<div class="card" style="' + (dueOrOverdue.length ? 'border-color:var(--rust)' : '') + '"><div class="eyebrow" style="margin-bottom:8px">All students — due or overdue</div>' +
    (dueOrOverdue.length === 0 ? '<div style="font-size:12px;color:var(--paper-dim)">All caught up.</div>' :
      dueOrOverdue.map((s) => '<div class="log-row" style="cursor:pointer" onclick="openAdminDetail(\'' + s.id + '\')"><span style="font-weight:600;font-size:12px;flex:1">' + s.name + '</span><span class="mono-sm">Due ' + s.due_date + '</span>' + stamp(s.fee_status) + '</div>').join('')) + '</div>' +
    '<div class="card"><div class="eyebrow" style="margin-bottom:8px">Coaches</div>' +
    (state.cache.coaches.length ? state.cache.coaches.map((c) => '<div class="log-row"><span style="font-weight:600;font-size:12px;flex:1">' + c.name + '</span><span style="font-size:11px;color:var(--paper-dim)">' + c.specialization + '</span></div>').join('') : '<div style="font-size:12px;color:var(--paper-dim)">No coaches signed up yet.</div>') + '</div>' +
    '<div class="span-2"><div class="section-head" style="margin-top:0"><span class="eyebrow">All students</span></div>' +
    '<div class="card" style="padding:0;overflow:hidden"><table class="ledger"><thead><tr><th>Student</th><th>Category</th><th>Attend.</th><th>Fee</th></tr></thead><tbody>' +
    (students.length ? students.map((s) => '<tr onclick="openAdminDetail(\'' + s.id + '\')"><td><div style="font-weight:600">' + s.name + '</div></td><td style="color:' + CATEGORIES[s.category].color + '">' + s.category + '</td><td><div class="mini-bar"><div class="mini-bar-fill" style="width:' + s.attendance + '%;background:' + (s.attendance >= 85 ? 'var(--forest)' : s.attendance >= 65 ? 'var(--brass)' : 'var(--rust)') + '"></div></div></td><td>' + stamp(s.fee_status) + '</td></tr>').join('') : '<tr><td colspan="4" style="padding:16px;color:var(--paper-dim)">No students signed up yet.</td></tr>') +
    '</tbody></table></div></div>' +
    '<div class="span-2"><div class="section-head"><span class="eyebrow">All invoices (' + state.cache.invoices.length + ')</span></div>' +
    '<div class="card" style="padding:0;overflow:hidden">' + (state.cache.invoices.length === 0 ? '<div style="padding:16px;font-size:12px;color:var(--paper-dim)">No payments recorded yet.</div>' :
    '<table class="ledger"><thead><tr><th>Invoice</th><th>Student</th><th>Amount</th><th>Method</th><th>Date</th></tr></thead><tbody>' +
    state.cache.invoices.map((i) => '<tr onclick="viewInvoice(' + i.id + ')"><td class="mono-sm">' + i.invoice_number + '</td><td style="font-weight:600">' + i.student_name + '</td><td>₹' + Number(i.amount).toLocaleString('en-IN') + '</td><td style="font-size:10.5px;color:var(--paper-dim)">' + i.method + '</td><td style="font-size:10.5px;color:var(--paper-dim)">' + new Date(i.paid_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) + '</td></tr>').join('') + '</tbody></table>') + '</div></div>' +
    '<div class="span-2"><div class="section-head"><span class="eyebrow">Fee structure</span></div><div class="fee-grid-2">' +
    Object.entries(CATEGORIES).map(([name, meta]) => '<div class="card fee-card">' + icon('target', 15, meta.color) + '<div style="flex:1"><div style="font-weight:600;font-size:12.5px">' + name + '</div><div style="font-size:10.5px;color:var(--paper-dim)">per month</div></div><div class="mono-lg" style="font-size:15px">₹' + meta.fee.toLocaleString('en-IN') + '</div></div>').join('') +
    '</div></div></div></div>' + (state.adminDetailId ? studentDetailModal() : '');
}

function screenLoading() {
  return '<div class="splash target-watermark" style="text-align:center"><div class="brand-center pulse-loading">' + icon('crosshair', 36, 'var(--brass)') +
    '<div class="eyebrow" style="margin-top:14px">Loading…</div></div></div>';
}

function App() {
  switch (state.screen) {
    case 'LOADING': return screenLoading();
    case 'AUTH': return screenAuth();
    case 'STUDENT_DASHBOARD': return screenStudentDashboard();
    case 'COACH_DASHBOARD': return screenCoachDashboard();
    case 'ADMIN_DASHBOARD': return screenAdminDashboard();
    default: return screenAuth();
  }
}

render();
try {
  boot().catch((err) => {
    document.getElementById('root').innerHTML =
      '<div class="screen-pad" style="text-align:center;padding-top:60px"><div class="eyebrow" style="color:var(--rust);margin-bottom:8px">Something went wrong on load</div>' +
      '<div style="font-size:12px;color:var(--paper-dim);margin-bottom:16px">' + (err && err.message ? err.message : String(err)) + '</div>' +
      '<button class="btn-brass" style="max-width:200px;margin:0 auto" onclick="location.reload()">Reload</button></div>';
  });
} catch (err) {
  document.getElementById('root').innerHTML =
    '<div class="screen-pad" style="text-align:center;padding-top:60px"><div class="eyebrow" style="color:var(--rust);margin-bottom:16px">Something went wrong on load</div>' +
    '<button class="btn-brass" style="max-width:200px;margin:0 auto" onclick="location.reload()">Reload</button></div>';
}
</script>
</body>
</html>
