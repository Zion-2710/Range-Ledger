isplay: flex; align-items: center; gap: 10px; }  .load-error-banner button { font-size: 11px; font-weight: 600; background: none; border: 1px solid var(--rust); color: var(--rust); border-radius: 6px; padding: 4px 9px; cursor: pointer; }  .config-banner code { background: rgba(0,0,0,0.25); padding: 1px 5px; border-radius: 3px; }   .phone {    width: 100%; max-width: 100%; margin: 0; border: none; border-radius: 0; overflow: hidden;    box-shadow: none; background: var(--bg); min-height: 100vh;  }  .status-bar { display: flex; justify-content: space-between; padding: 8px 18px 0; font-size: 11px; color: var(--paper-dim); font-family: 'IBM Plex Mono', monospace; }   .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.01em; color: var(--paper-dim); }  .card > .eyebrow:first-child, .app-topbar .eyebrow, .section-head .eyebrow {    font-size: 13px; font-weight: 700; color: var(--paper); letter-spacing: 0;  }  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
