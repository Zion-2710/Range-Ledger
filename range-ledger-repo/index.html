<!DOCTYPE html>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<!--
  Security note: script-src includes 'unsafe-inline' because this app's
  entire interaction model uses inline onclick/onchange/oninput attributes
  on dynamically generated HTML — removing that would break every button
  in the app without a fundamental rewrite to addEventListener-based
  delegation. What this CSP DOES meaningfully restrict: only the three
  CDN domains this app actually loads scripts from are trusted (blocking
  a malicious script tag from loading code off some other domain), and
  connect-src limits network requests to Supabase — so even if a stored
  XSS payload somehow ran, it couldn't easily exfiltrate data to an
  arbitrary attacker-controlled server.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co;" />
<meta name="referrer" content="strict-origin-when-cross-origin" />

<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root {
    --bg: #EAF2FB; --ink: #FFFFFF; --paper: #12233F; --paper-dim: #64789A;
    --brass: #1D6FE0; --warning: #D9A62E; --olive: #3D6EA8; --forest: #2E8B57; --rust: #C0392B;
    --line: #D3E3F5; --line-soft: #E4EEFA; --line-strong: #7FA8D9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: 'IBM Plex Sans', sans-serif; color: var(--paper); position: relative; }

  .bg-target {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 18% 22%, rgba(15,35,70,0.28) 0 3px, transparent 3px 4.5px),
      radial-gradient(circle at 83% 16%, rgba(15,35,70,0.24) 0 2.5px, transparent 2.5px 4px),
      radial-gradient(circle at 72% 82%, rgba(15,35,70,0.26) 0 3px, transparent 3px 4.5px),
      radial-gradient(circle at 10% 78%, rgba(15,35,70,0.22) 0 2.5px, transparent 2.5px 4px),
      radial-gradient(circle at 90% 58%, rgba(15,35,70,0.24) 0 2.5px, transparent 2.5px 4px),
      radial-gradient(circle at 50% 34%, rgba(29,111,224,0.55) 0 7px, transparent 7px 8px),
      repeating-radial-gradient(circle at 50% 34%, rgba(29,111,224,0.20) 0px, rgba(29,111,224,0.20) 3px, transparent 3px, transparent 42px),
      repeating-radial-gradient(circle at 50% 34%, rgba(15,35,70,0.06) 0px, rgba(15,35,70,0.06) 1px, transparent 1px, transparent 42px);
  }
  .phone { position: relative; z-index: 1; }

  .config-banner { background: #B5432B; color: #fff; font-size: 12px; padding: 10px 16px; text-align: center; font-family: 'IBM Plex Mono', monospace; position: relative; z-index: 2; }
  .load-error-banner { background: rgba(29,111,224,0.12); border: 1px solid var(--rust); color: var(--rust); border-radius: 6px; padding: 10px 12px; font-size: 12px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
  .load-error-banner button { font-family: 'Oswald', sans-serif; text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.04em; background: none; border: 1px solid var(--rust); color: var(--rust); border-radius: 5px; padding: 4px 8px; cursor: pointer; }
  .config-banner code { background: rgba(0,0,0,0.25); padding: 1px 5px; border-radius: 3px; }

  .phone {
    width: 100%; max-width: 100%; margin: 0; border: none; border-radius: 0; overflow: hidden;
    box-shadow: none; background: var(--bg); min-height: 100vh;
  }
  .status-bar { display: flex; justify-content: space-between; padding: 8px 18px 0; font-size: 11px; color: var(--paper-dim); font-family: 'IBM Plex Mono', monospace; }

  .eyebrow { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10px; font-weight: 600; color: var(--paper-dim); }
  /* Real section/card headings — the eyebrow that opens a card — get a
     distinct, more designed treatment instead of sharing the same flat
     style as every tiny inline label (stat captions, timestamps, etc). */
  .card > .eyebrow:first-child, .app-topbar .eyebrow, .section-head .eyebrow {
    font-size: 13px; font-weight: 700; color: var(--brass); letter-spacing: 0.04em;
  }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--line-strong); }

  .app-topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .screen-pad { padding: 16px; }
  .splash { padding: 50px 20px 20px; position: relative; overflow: hidden; }
  .brand-icon-ring { position: relative; display: inline-flex; }
  .brand-icon-ring::before {
    content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 130px; height: 130px; border-radius: 50%; pointer-events: none;
    background:
      radial-gradient(circle, rgba(29,111,224,0.6) 0 5px, transparent 5px 6px),
      repeating-radial-gradient(circle, rgba(29,111,224,0.22) 0px, rgba(29,111,224,0.22) 2px, transparent 2px, transparent 14px);
  }
  .brand-center { text-align: center; }
  .pulse-loading { animation: pulseFade 1.4s ease-in-out infinite; }
  @keyframes pulseFade { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .brand-title { font-family: 'Oswald', sans-serif; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--brass); }
  .brand-sub { font-size: 12px; color: var(--paper-dim); margin-top: 2px; }

  .auth-tabs { display: flex; gap: 6px; margin-bottom: 16px; }

  .role-card { display: flex; align-items: center; gap: 12px; width: 100%; background: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 10px; color: var(--paper); cursor: pointer; text-align: left; }
  .role-card:hover { border-color: var(--brass); }

  .field-label { display: block; font-size: 11px; font-weight: 700; color: var(--brass); margin: 10px 0 4px; font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
  .text-input { width: 100%; background: var(--ink); border: 1px solid var(--line); color: var(--paper); border-radius: 6px; padding: 9px 10px; font-size: 13px; font-family: 'IBM Plex Sans', sans-serif; }
  select.text-input { appearance: none; }

  .btn-brass { background: var(--brass); color: var(--ink); border: none; font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; font-size: 11.5px; font-weight: 600; padding: 10px 14px; border-radius: 5px; cursor: pointer; width: 100%; }
  .btn-brass:hover { filter: brightness(1.08); }
  .btn-brass:disabled { opacity: 0.6; cursor: default; }

  .icon-btn { background: var(--ink); border: 1px solid var(--line); border-radius: 8px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; color: var(--paper-dim); cursor: pointer; position: relative; }
  .icon-btn.small { width: 26px; height: 26px; }
  .dot-badge { position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; border-radius: 50%; background: var(--brass); border: 1.5px solid var(--bg); }

  .popover { position: absolute; top: 42px; right: 0; width: 250px; background: var(--ink); border: 1px solid var(--brass); border-radius: 8px; padding: 12px; z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .popover.cal-popover { width: 292px; }
  .popover-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .reminder-list { display: flex; flex-direction: column; gap: 2px; max-height: 150px; overflow: auto; }
  .reminder-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 2px dashed var(--line-strong); }
  .reminder-row:last-child { border-bottom: none; }

  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 9.5px; color: var(--paper-dim); margin-bottom: 4px; font-family: 'IBM Plex Mono', monospace; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 4px; }
  .cal-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 5px; cursor: pointer; font-size: 10.5px; font-family: 'IBM Plex Mono', monospace; color: var(--paper); }
  .cal-cell:hover { background: rgba(29,111,224,0.14); }
  .cal-cell.empty { cursor: default; visibility: hidden; }
  .cal-cell.today { border: 1px solid var(--brass); }
  .cal-cell.selected { background: var(--brass); color: var(--ink); font-weight: 600; }
  .cal-dots { display: flex; gap: 2px; margin-top: 1px; height: 4px; }
  .cal-dot { width: 4px; height: 4px; border-radius: 50%; }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 6px 10px; margin: 8px 0; padding-top: 8px; border-top: 2px dashed var(--line-strong); }
  .elig-badge { display: inline-block; font-family: 'Oswald', sans-serif; font-size: 8.5px; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600; color: var(--elig-color); border: 1px solid var(--elig-color); border-radius: 3px; padding: 1px 5px; }
  .legend-item { display: flex; align-items: center; gap: 4px; font-size: 9px; color: var(--paper-dim); }
  .legend-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 30; padding: 20px; }
  .modal-card { background: var(--ink); border: 1px solid var(--brass); border-radius: 10px; padding: 18px; width: 100%; max-width: 300px; max-height: 640px; overflow-y: auto; }
  .receipt-card { background: repeating-linear-gradient(var(--ink), var(--ink) 27px, var(--line-soft) 27px, var(--line-soft) 28px); }
  .receipt-row { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; padding: 4px 0; }
  .receipt-row span:first-child { color: var(--paper-dim); }
  .pay-option { width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--line); color: var(--paper); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .pay-option:hover { border-color: var(--brass); }

  .card { background: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .stat-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .statcard { background: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
  .statcard-icon { width: 30px; height: 30px; border-radius: 6px; background: rgba(29,111,224,0.12); color: var(--brass); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .statcard-value { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 16px; }
  .fee-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fee-card { display: flex; align-items: center; gap: 8px; padding: 12px; }

  .mono-lg { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 20px; margin-bottom: 4px; }
  .mono-sm { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--brass); }
  .detail-name { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 17px; }

  .toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .chip { font-family: 'Oswald', sans-serif; font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--ink); color: var(--paper-dim); cursor: pointer; }
  .chip-active { border-color: var(--brass); color: var(--brass); }

  .stamp { display: inline-flex; align-items: center; gap: 5px; font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 0.07em; font-weight: 600; color: var(--stamp-color); border: 1.5px solid var(--stamp-color); padding: 3px 8px 3px 6px; border-radius: 3px; transform: rotate(-3deg); position: relative; }
  .stamp::before { content: ''; position: absolute; inset: -3px; border: 1px solid var(--stamp-color); opacity: 0.35; border-radius: 4px; pointer-events: none; }

  .logbook { display: flex; flex-direction: column; }
  .analysis-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 10px 0; padding: 8px; background: var(--line-soft); border-radius: 6px; }
  .analysis-cell { text-align: center; }
  .log-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 2px dashed var(--line-strong); }
  .log-row:last-child { border-bottom: none; }

  .ledger { width: 100%; border-collapse: collapse; }
  .ledger th { text-align: left; font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; font-size: 9.5px; color: var(--paper-dim); padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .ledger td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); font-size: 12px; }
  .ledger tr:last-child td { border-bottom: none; }
  .ledger tbody tr { cursor: pointer; }
  .ledger tbody tr:hover { background: rgba(29,111,224,0.06); }

  .mini-bar { width: 60px; height: 6px; background: var(--line-soft); border-radius: 3px; overflow: hidden; }
  .mini-bar-fill { height: 100%; border-radius: 3px; }

  .back-btn { display: flex; align-items: center; gap: 4px; background: none; border: none; color: var(--paper-dim); font-size: 12px; cursor: pointer; margin-bottom: 10px; padding: 0; }
  .back-btn:hover { color: var(--brass); }

  .avatar-fallback { border-radius: 50%; background: var(--olive); color: var(--ink); display: flex; align-items: center; justify-content: center; font-family: 'Oswald', sans-serif; font-weight: 600; border: 1.5px solid var(--brass); }

  /* Toasts */
  .toast-stack { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; width: min(340px, calc(100% - 28px)); pointer-events: none; }
  .toast { pointer-events: auto; background: var(--ink); border: 1px solid var(--line); border-left: 4px solid var(--brass); border-radius: 7px; padding: 10px 12px; font-size: 12.5px; box-shadow: 0 10px 28px rgba(15,35,70,0.22); display: flex; align-items: flex-start; gap: 8px; animation: toast-in 0.25s ease; }
  .toast.success { border-left-color: var(--forest); }
  .toast.error { border-left-color: var(--rust); }
  .toast-close { background: none; border: none; color: var(--paper-dim); cursor: pointer; padding: 0; margin-left: auto; flex-shrink: 0; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

  /* Loading screen */
  .loading-crosshair { animation: pulse-fade 1.6s ease-in-out infinite; }
  @keyframes pulse-fade { 0%, 100% { opacity: 0.45; transform: scale(0.94); } 50% { opacity: 1; transform: scale(1); } }

  /* Photo upload */
  .photo-upload { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .photo-upload-btn { display: flex; align-items: center; gap: 6px; background: var(--ink); border: 1px dashed var(--line); color: var(--paper-dim); border-radius: 6px; padding: 10px 12px; font-size: 12px; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
  .photo-upload-btn:hover { border-color: var(--brass); color: var(--brass); }

  /* Password visibility toggle */
  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 36px; }
  .password-toggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--paper-dim); cursor: pointer; padding: 4px; display: flex; }
  .password-toggle:hover { color: var(--brass); }

  /* General interactivity polish */
  .btn-brass, .chip, .role-card, .pay-option, .icon-btn, .photo-upload-btn { transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease, filter 0.12s ease, background 0.12s ease; }
  .btn-brass:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(29,111,224,0.3); }
  .btn-brass:active:not(:disabled) { transform: translateY(0); }
  .role-card:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(15,35,70,0.08); }
  .card, .statcard { box-shadow: 0 1px 2px rgba(15,35,70,0.04), 0 2px 8px rgba(15,35,70,0.05); transition: box-shadow 0.15s ease, transform 0.15s ease; }
  .chip:hover { border-color: var(--brass); color: var(--brass); }
  .icon-btn:hover { border-color: var(--brass); color: var(--brass); background: rgba(29,111,224,0.08); }
  .text-input { transition: border-color 0.12s ease, box-shadow 0.12s ease; }
  .text-input:focus { outline: none; border-color: var(--brass); box-shadow: 0 0 0 3px rgba(29,111,224,0.14); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .role-card:focus-visible {
    outline: 2px solid var(--brass); outline-offset: 1px;
  }
  .modal-card { animation: modal-in 0.18s ease; }
  @keyframes modal-in { from { opacity: 0; transform: translateY(6px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  ::selection { background: rgba(29,111,224,0.25); }
  .toast {
    position: fixed; top: 14px; left: 14px; right: 14px; z-index: 60; margin: 0 auto; max-width: 380px;
    background: var(--ink); border: 1.5px solid var(--toast-color); border-radius: 9px; padding: 11px 12px;
    display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--paper);
    box-shadow: 0 8px 24px rgba(15,35,70,0.18); cursor: pointer; animation: toast-in 0.2s ease;
  }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  .sync-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 9.5px; font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; padding: 4px 8px; border-radius: 12px; white-space: nowrap; }
  .sync-offline { background: rgba(194,57,57,0.12); color: var(--rust); }
  .sync-syncing { background: rgba(29,111,224,0.12); color: var(--brass); animation: pulseFade 1.2s ease-in-out infinite; }
  .sync-pending { background: rgba(217,166,46,0.16); color: var(--warning); }
  .queued-tag { font-size: 9px; font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.03em; color: var(--warning); font-style: normal; }
  .password-wrap { position: relative; }
  .password-wrap .text-input { padding-right: 38px; }
  .password-toggle-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--paper-dim); cursor: pointer; padding: 4px; display: flex; }
  .password-toggle-btn:hover { color: var(--brass); }

  /* Auth card — gives sign in/up its own elevated surface instead of sitting
     directly on the page background, like a real app's login screen. */
  .auth-card { background: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 24px 22px; margin-top: 22px; box-shadow: 0 1px 2px rgba(15,35,70,0.05), 0 12px 32px rgba(15,35,70,0.10); animation: modal-in 0.22s ease; }
  .auth-tabs { background: var(--line-soft); border-radius: 9px; padding: 3px; }
  .auth-tab { flex: 1; text-align: center; padding: 8px; border-radius: 7px; border: none; background: transparent; color: var(--paper-dim); font-family: 'Oswald', sans-serif; text-transform: uppercase; font-size: 11.5px; letter-spacing: 0.05em; cursor: pointer; transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease; }
  .auth-tab.active { background: var(--ink); color: var(--brass); font-weight: 700; box-shadow: 0 1px 3px rgba(15,35,70,0.12); }
  .avatar-fallback, .avatar-photo { box-shadow: 0 2px 6px rgba(15,35,70,0.15); }

  .dashboard-grid { display: flex; flex-direction: column; gap: 12px; }
  .dashboard-grid .span-2 { }
  .score-views { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; }
  .score-panel { min-width: 0; }
  .score-views .score-panel:nth-child(2) { border-left: 2px dashed var(--line-strong); padding-left: 10px; }

// =============================================================================
// Offline support — scoped to attendance logging, as that's the one action
// that genuinely needs to keep working at a range with no signal. Actions
// taken while offline (or when a request simply fails to reach the server)
// are queued in localStorage and replayed automatically once connectivity
// returns. Wrapped in try/catch throughout: some browser contexts (private
// browsing, certain sandboxed previews) restrict localStorage entirely —
// in that case offline support just quietly doesn't persist across a
// reload, rather than crashing the app.
// =============================================================================
const OFFLINE_QUEUE_KEY = 'rangeLedgerOfflineQueue_v1';
function loadOfflineQueue() {
  try {
    const raw = localStorage.getItem(OFFLINE_QUEUE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveOfflineQueue() {
  try { localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(state.syncQueue)); } catch (e) { /* storage unavailable — degrade gracefully */ }
}
// Multi-device note: this queue lives in localStorage, so it is inherently
// per-device — there's no way for a phone and a laptop to compare queues
// while both are offline (nothing can sync data between two offline
// devices; that's not solvable, only the moment each comes back online).
// The actual merge strategy is: each device syncs its own queue
// independently, and syncing is written to be safe regardless of what any
// other device has already done —
//   • mark_attendance checks the server for an existing PENDING request for
//     that student+day *before* inserting, so if two devices both queued
//     "mark today's attendance" while offline, whichever syncs first wins
//     and the second is dropped as redundant rather than creating a
//     duplicate row.
//   • set_attendance_status is a plain update-by-id, which is naturally
//     safe to apply twice — if a coach's phone and laptop disagree (one
//     approves, one rejects), this is a real conflict with no way to know
//     which was "intended" last without a timestamp on the server side,
//     so whichever device syncs last wins. Existing Realtime subscriptions
//     already propagate the final state to every other open tab/device
//     once it lands.
function queueOfflineAction(type, payload) {
  // Replace any existing queued action targeting the same thing, instead
  // of stacking duplicates — if you tap Approve then Reject while offline
  // on the same device, only your final decision should be queued.
  if (type === 'set_attendance_status') {
    state.syncQueue = state.syncQueue.filter((a) => !(a.type === 'set_attendance_status' && a.payload.reqId === payload.reqId));
  } else if (type === 'mark_attendance') {
    state.syncQueue = state.syncQueue.filter((a) => !(a.type === 'mark_attendance' && a.payload.studentId === payload.studentId && a.payload.requestedDate === payload.requestedDate));
  }
  state.syncQueue.push({ id: 'q-' + Date.now() + '-' + Math.random().toString(36).slice(2), type, payload, createdAt: new Date().toISOString() });
  saveOfflineQueue();
}
function myOfflineAttendanceActions() {
  if (!state.me) return [];
  return state.syncQueue.filter((a) => a.type === 'mark_attendance' && a.payload.studentId === state.me.id);
}
function isQueuedForSync(reqId) {
  return state.syncQueue.some((a) => a.type === 'set_attendance_status' && a.payload.reqId === reqId);
}
async function syncOfflineQueue() {
  if (state.syncing || !state.isOnline || !sb || state.syncQueue.length === 0) return;
  state.syncing = true; render();
  const remaining = [];
  let duplicatesDropped = 0;
  for (const action of state.syncQueue) {
    try {
      if (action.type === 'mark_attendance') {
        // Check the server first — another device may have already synced
        // this exact student+day while we were offline. If so, this queued
        // copy is redundant; drop it instead of creating a duplicate row.
        const { data: existing, error: checkErr } = await sb.from('attendance_requests').select('id').eq('student_id', action.payload.studentId).eq('requested_date', action.payload.requestedDate).eq('status', 'PENDING').maybeSingle();
        if (checkErr) throw checkErr;
        if (existing) { duplicatesDropped++; continue; }
        const { error } = await sb.from('attendance_requests').insert({ student_id: action.payload.studentId, requested_date: action.payload.requestedDate, status: 'PENDING' });
        if (error) throw error;
      } else if (action.type === 'set_attendance_status') {
        const { error } = await sb.from('attendance_requests').update({ status: action.payload.status }).eq('id', action.payload.reqId);
        if (error) throw error;
      }
    } catch (err) {
      remaining.push(action); // network still bad, or a real error — keep it queued and retry next time
    }
  }
  const syncedCount = state.syncQueue.length - remaining.length - duplicatesDropped;
  state.syncQueue = remaining;
  saveOfflineQueue();
  state.syncing = false;

  if (state.screen === 'STUDENT_DASHBOARD') await refreshStudentData();
  else if (state.screen === 'COACH_DASHBOARD') await refreshCoachData();
  else render();

  if (remaining.length === 0 && (syncedCount > 0 || duplicatesDropped > 0)) {
    const parts = [];
    if (syncedCount > 0) parts.push(syncedCount === 1 ? '1 update synced' : syncedCount + ' updates synced');
    if (duplicatesDropped > 0) parts.push(duplicatesDropped === 1 ? '1 already recorded from another device' : duplicatesDropped + ' already recorded from another device');
    showToast(parts.join(' · ') + '.', 'success');
  } else if (syncedCount > 0 || duplicatesDropped > 0) {
    showToast('Some offline updates synced — ' + remaining.length + ' still waiting.', 'info');
  }
}
function setupConnectivityListeners() {
  window.addEventListener('online', () => { state.isOnline = true; render(); syncOfflineQueue(); });
  window.addEventListener('offline', () => { state.isOnline = false; render(); });
  // Safety net: the browser's online/offline events don't always fire
  // reliably (e.g. a wifi connection that's "up" but not actually routing
  // anywhere) — this catches anything left queued regardless.
  setInterval(() => { if (state.isOnline && state.syncQueue.length > 0) syncOfflineQueue(); }, 20000);

// Auto-logout after inactivity — a real security consideration for an app
// that's often used on a shared range-side device or a coach's shop
// computer, not just someone's personal phone. Warns 5 minutes before it
// actually signs out, and any real interaction resets the clock.
const INACTIVITY_LIMIT_MS = 30 * 60 * 1000;

let inactivityWarned = false;

function setupInactivityMonitor() {
  ['click', 'keydown', 'touchstart', 'mousemove'].forEach((evt) => window.addEventListener(evt, resetActivityTimer, { passive: true }));
  setInterval(() => {
    if (!state.session || state.screen === 'AUTH' || state.screen === 'LOADING') return;
    const elapsed = Date.now() - lastActivityAt;
    if (elapsed >= INACTIVITY_LIMIT_MS) {
      logout();
      showToast('You were signed out after 30 minutes of inactivity.', 'info');
    } else if (elapsed >= INACTIVITY_WARNING_MS && !inactivityWarned) {
      inactivityWarned = true;

}

// Resizes and re-compresses as JPEG until it fits under 1MB, instead of just
// rejecting anything over the limit — most phone camera photos are several
// MB straight out of the camera, so a hard reject would block almost everyone.
function compressImageToUnder1MB(file) {
  const MAX_BYTES = 1024 * 1024;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('could not read the file'));
    reader.onload = (ev) => {
      const img = new Image();
      img.onerror = () => reject(new Error('could not load that image'));
      img.onload = () => {
        let width = img.width, height = img.height;
        const maxDim = 900;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        let quality = 0.9;
        const tryExport = () => {
          canvas.toBlob((blob) => {
            if (!blob) { reject(new Error('compression failed')); return; }
            if (blob.size <= MAX_BYTES || quality <= 0.3) {
              resolve(new File([blob], (file.name.replace(/\.[^.]+$/, '') || 'photo') + '.jpg', { type: 'image/jpeg' }));
            } else {
              quality -= 0.15;
              tryExport();
            }
          }, 'image/jpeg', quality);
        };
        tryExport();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

const FORM_DRAFT_KEY = 'rangeLedgerFormDraft_v1';

async function submitSignUp() {

  let phone = '', category = '', shooterCategory = '', coachId = '', coachName = '', nationalQualified = 'false', shooterId = '', nraiEmail = '', specialization = '', academyName = '', academyAddress = '', laneReservation = 'false', upiId = '', gstin = '', gstPercent = '0';

    if (!nraiEmail || !nraiEmail.includes('@')) { showToast('Please enter the email you used for your NRAI account.'); return; }
  } else if (role === 'coach') {
    specialization = f.specialization;
    academyName = f.academyName.trim();
    academyAddress = f.academyAddress.trim();
    upiId = f.upiId.trim();
    laneReservation = f.laneReservation;
    if (f.gstRegistered === 'true') {
      gstin = f.gstin.trim();
      gstPercent = f.gstPercent || '0';
      if (!gstin) { showToast('Please enter your GSTIN, or switch GST registration to No.'); return; }
    }
    if (!academyName) { showToast('Please enter your academy\'s name.'); return; }

  setBusy(true); render();
  // These extra fields ride along as auth metadata, so the database trigger
  // (see migration 20260101000001) can create the profiles/students/coaches

  // there's no active session yet to run a normal insert with.
  const { data: signUpData, error: signUpErr } = await sb.auth.signUp({

    options: { data: { role, name, phone, category, shooter_category: shooterCategory, coach_id: coachId, coach_name: coachName, national_qualified: nationalQualified, nrai_shooter_id: shooterId, nrai_email: nraiEmail, specialization, academy_name: academyName, academy_address: academyAddress, lane_reservation: laneReservation, academy_upi_id: upiId, academy_gstin: gstin, gst_percent: gstPercent } },

  }

  // Photo upload needs an active session, so it only happens here (not in

  // just fills in the photo afterward.
  if (role === 'student' && state.pendingPhotoFile) {
    const path = user.id + '/' + Date.now() + '-' + state.pendingPhotoFile.name;

function getQualificationStatus(studentId, category) {

// =============================================================================
// Realtime — keeps two open tabs (e.g. a student and their coach) in sync
// without a manual refresh. Each dashboard subscribes to the tables it
// cares about on entry, and the previous subscription is always torn down
// first so switching screens never leaves a stale listener running.
// =============================================================================
let realtimeChannel = null;
let realtimeDebounceTimer = null;
function teardownRealtime() { if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; } }
function debounceRefresh(fn) { clearTimeout(realtimeDebounceTimer); realtimeDebounceTimer = setTimeout(fn, 250); }

async function refreshStudentData() {

  state.cache.myInvoices = await fetchMyInvoices(state.me.id);

}
function setupStudentRealtime() {
  teardownRealtime();
  realtimeChannel = sb.channel('rl-student-' + state.me.id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'attendance_requests', filter: 'student_id=eq.' + state.me.id }, () => debounceRefresh(refreshStudentData))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'students', filter: 'id=eq.' + state.me.id }, () => debounceRefresh(refreshStudentData))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'inventory_issues', filter: 'student_id=eq.' + state.me.id }, () => debounceRefresh(refreshStudentData))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'invoices', filter: 'student_id=eq.' + state.me.id }, () => debounceRefresh(refreshStudentData))
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notification_broadcasts' }, () => debounceRefresh(refreshStudentData))
    .subscribe();
}

function lineChartSvg(data, max, yFloor) {
  const w = 272, h = 130, padL = 34, padB = 20, padT = 8, padR = 8;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const xStep = innerW / (data.length - 1 || 1);
  const scaleY = (v) => padT + innerH - ((v - yFloor) / (max - yFloor)) * innerH;
  const points = data.map((d, i) => (padL + i * xStep) + ',' + scaleY(d.score)).join(' ');
  const gridLines = [0, 0.5, 1].map((f) => { const y = padT + innerH * f; return '<line x1="' + padL + '" y1="' + y + '" x2="' + (w - padR) + '" y2="' + y + '" stroke="var(--line-soft)" stroke-dasharray="2 4"/>'; }).join('');
  const dots = data.map((d, i) => '<circle cx="' + (padL + i * xStep) + '" cy="' + scaleY(d.score) + '" r="3" fill="var(--brass)"/>').join('');
  const labels = data.map((d, i) => '<text x="' + (padL + i * xStep) + '" y="' + (h - 4) + '" font-size="10" fill="var(--paper-dim)" text-anchor="middle" font-family="IBM Plex Mono">' + d.session + '</text>').join('');
  if (data.length === 0) return '';
  return '<svg width="100%" viewBox="0 0 ' + w + ' ' + h + '" style="overflow:visible">' + gridLines + '<polyline points="' + points + '" fill="none" stroke="var(--brass)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' + dots + labels + '</svg>';
}
function performanceAnalysis(data, max) {
  if (data.length < 2) return null;
  const scores = data.map((d) => d.score);
  const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
  const best = Math.max(...scores);
  const mid = Math.floor(scores.length / 2);
  const firstHalf = scores.slice(0, mid || 1), secondHalf = scores.slice(mid || 1);
  const firstAvg = firstHalf.reduce((a, b) => a + b, 0) / firstHalf.length;
  const secondAvg = secondHalf.length ? secondHalf.reduce((a, b) => a + b, 0) / secondHalf.length : firstAvg;
  const diff = secondAvg - firstAvg;
  let trend, trendColor;
  if (diff > max * 0.015) { trend = 'Improving ↑'; trendColor = 'var(--forest)'; }
  else if (diff < -max * 0.015) { trend = 'Declining ↓'; trendColor = 'var(--rust)'; }
  else { trend = 'Steady →'; trendColor = 'var(--brass)'; }
  const variance = scores.reduce((a, b) => a + Math.pow(b - avg, 2), 0) / scores.length;
  const stdDev = Math.sqrt(variance);
  const consistency = stdDev < max * 0.03 ? 'Very consistent' : stdDev < max * 0.06 ? 'Some variation' : 'High variation';
  return { avg, best, trend, trendColor, consistency };
}
function scorePanel(studentId, mode, allowLogging) {
  const shots = Number(state.chartMatchType);
  const max = mode === 'decimal' ? MAX_DECIMAL[shots] : MAX_INTEGER[shots];
  const perShot = mode === 'decimal' ? 10.9 : 10;
  const data = scoresFor(studentId, shots, mode);
  const fmt = (v) => mode === 'decimal' ? v.toFixed(1) : Math.round(v);
  const yFloor = mode === 'decimal' ? Math.round(max * 0.4 * 10) / 10 : Math.round(max * 0.4);
  const analysis = performanceAnalysis(data, max);
  const label = mode === 'decimal' ? 'Decimal scoring (10.9/shot)' : 'Whole scoring (10.0/shot)';
  return '<div class="score-panel"><div class="eyebrow" style="margin-bottom:8px">' + label + '</div>' +
    '<div style="font-size:10.5px;color:var(--paper-dim);margin-bottom:8px">Max for ' + state.chartMatchType + ' shots: <span class="mono-sm" style="color:var(--paper)">' + max.toFixed(1) + '</span> (' + perShot + ' pts/shot)</div>' +
    (data.length === 0 ? '<div style="text-align:center;padding:20px 0;color:var(--paper-dim);font-size:11.5px;border:1px dashed var(--line);border-radius:6px">No sessions logged yet.' + (allowLogging ? '<br/>Add your first score below.' : '') + '</div>' :
    lineChartSvg(data, max, yFloor) +
    (analysis ? '<div class="analysis-grid"><div class="analysis-cell"><div class="mono-sm" style="font-size:13px;color:var(--paper)">' + fmt(analysis.avg) + '</div><div class="eyebrow" style="font-size:9px">Average</div></div>' +
      '<div class="analysis-cell"><div class="mono-sm" style="font-size:13px;color:var(--paper)">' + fmt(analysis.best) + '</div><div class="eyebrow" style="font-size:9px">Best</div></div>' +
      '<div class="analysis-cell"><div class="mono-sm" style="font-size:13px;color:' + analysis.trendColor + '">' + analysis.trend + '</div><div class="eyebrow" style="font-size:9px">Trend</div></div>' +
      '<div class="analysis-cell"><div class="mono-sm" style="font-size:11.5px;color:var(--paper)">' + analysis.consistency + '</div><div class="eyebrow" style="font-size:9px">Consistency</div></div></div>'
      : '<div style="font-size:10.5px;color:var(--paper-dim);margin:6px 0">Log at least 2 sessions to see your performance analysis.</div>')) +
    (allowLogging ? '<div style="margin-top:12px;border-top:2px dashed var(--line-strong);padding-top:10px"><div class="eyebrow" style="margin-bottom:6px">Log a session score</div>' +
      '<div style="font-size:10.5px;color:var(--paper-dim);margin-bottom:6px">Enter your ' + state.chartMatchType + '-shot score out of ' + max.toFixed(1) + '</div>' +
      '<input id="sessionScoreInput_' + mode + '" class="text-input" type="number" step="0.1" min="0" max="' + max + '" placeholder="e.g. ' + (max * 0.75).toFixed(1) + '" style="margin-bottom:8px"/>' +
      '<button class="btn-brass" onclick="logSessionScore(\'' + mode + '\')">Add session</button></div>' : '') + '</div>';
}

async function logSessionScore(mode) {
  const input = document.getElementById('sessionScoreInput_' + mode);
  const val = parseFloat(input.value);
  const shots = Number(state.chartMatchType);
  const max = mode === 'decimal' ? MAX_DECIMAL[shots] : MAX_INTEGER[shots];
  if (isNaN(val) || val < 0 || val > max) { showToast('Please enter a score between 0 and ' + max.toFixed(1) + '.'); return; }

async function generateInvoice(student, method) {
  const invoiceNumber = 'INV-' + String(student.id).slice(0, 8).toUpperCase() + '-' + Date.now().toString().slice(-6);

  // The student's actual coach/academy — never guess this via weapon
  // category, since that could match an entirely unrelated academy that
  // happens to teach the same weapon.
  const { data: coachMatch } = student.coach_id
    ? await sb.from('coaches').select('*').eq('id', student.coach_id).maybeSingle()
    : { data: null };

  // Any inventory items this coach has actually issued (approved, not just
  // requested or declined) to the student but not yet billed.
  let pendingIssues = [];
  if (coachMatch) {
    const { data: issues } = await sb.from('inventory_issues').select('*').eq('student_id', student.id).eq('invoiced', false).eq('status', 'issued');
    pendingIssues = issues || [];
  }

  const fee = CATEGORIES[student.category].fee;
  const items = [{ description: 'Shooting Training Coaching Fee', qty: 1, rate: fee, amount: fee }];
  pendingIssues.forEach((iss) => {
    items.push({ description: iss.item_name, qty: iss.quantity, rate: Number(iss.unit_price), amount: iss.quantity * Number(iss.unit_price) });
  });
  const subtotal = items.reduce((sum, it) => sum + it.amount, 0);
  const gstPercent = coachMatch && coachMatch.gst_percent ? Number(coachMatch.gst_percent) : 0;
  const gstAmount = Math.round(subtotal * gstPercent) / 100;
  const total = Math.round((subtotal + gstAmount) * 100) / 100;

  const { data } = await sb.from('invoices').insert({
    invoice_number: invoiceNumber, student_id: student.id, student_name: student.name,
    email: student.email, category: student.category, amount: total, method,
    items, batch: student.batch, shooter_id: student.nrai_shooter_id || null,
    subtotal, gst_percent: gstPercent, gst_amount: gstAmount, academy_gstin: coachMatch ? coachMatch.academy_gstin : null,
    academy_name: coachMatch && coachMatch.academy_name ? coachMatch.academy_name : 'Range Ledger',
    academy_address: coachMatch ? coachMatch.academy_address : null,
    lane: coachMatch && coachMatch.lane_reservation ? 'Reserved' : null,
  }).select().single();

  if (pendingIssues.length && data) {
    await sb.from('inventory_issues').update({ invoiced: true, invoice_id: data.id }).eq('student_id', student.id).eq('invoiced', false);
  }
  return data;
}
// UPI/Google Pay: the student pays through their own UPI app via a real
// upi://pay deep link straight to the coach's academy UPI ID — this app
// never touches the money or gets a payment-success callback (that would
// need a real payment gateway with server-side secrets). Instead, the
// student's status goes to PAYMENT_PENDING, and the coach/admin confirms
// they actually received it (same pattern as Cash) before the invoice
// is generated and sent.
async function payVia(method) {
  const student = state.me;
  if (method === 'Cash') {
    await sb.from('students').update({ fee_status: 'PAYMENT_PENDING', pending_method: 'Cash' }).eq('id', student.id);
    student.fee_status = 'PAYMENT_PENDING'; student.pending_method = 'Cash';
    state.paymentOpen = false; render();
    return;
  }

  if (!student.coach_id) {
    showToast('You don\'t have a coach assigned yet — please use Cash for now, or contact your academy.');
    return;
  }
  const { data: coachMatch } = await sb.from('coaches').select('academy_name, academy_upi_id').eq('id', student.coach_id).maybeSingle();
  if (!coachMatch || !coachMatch.academy_upi_id) {
    showToast('Your coach hasn\'t set up a UPI ID for online payments yet — please use Cash for now.');
    return;
  }

  const fee = CATEGORIES[student.category].fee;
  const payeeName = encodeURIComponent(coachMatch.academy_name || 'Range Ledger');
  const note = encodeURIComponent('Range Ledger - ' + student.category + ' fee');
  const upiLink = 'upi://pay?pa=' + encodeURIComponent(coachMatch.academy_upi_id) + '&pn=' + payeeName + '&am=' + fee + '&cu=INR&tn=' + note;

  await sb.from('students').update({ fee_status: 'PAYMENT_PENDING', pending_method: method }).eq('id', student.id);
  student.fee_status = 'PAYMENT_PENDING'; student.pending_method = method;
  state.paymentOpen = false;
  render();

  // Hand off to the UPI app (Google Pay, or whichever the device opens for
  // a upi:// link). On desktop browsers with no UPI app registered, this
  // will typically just fail to open anything — UPI payments are
  // inherently a mobile-app handoff.
  window.location.href = upiLink;
  showToast('Opening ' + method + ' to complete your payment of ₹' + fee.toLocaleString('en-IN') + '. Once your coach confirms they\'ve received it, your status will update to Paid and your invoice will be ready to download.', 'info');
}

// WhatsApp's click-to-chat link (wa.me) is the only way to pre-fill a
// message without needing the WhatsApp Business API — it opens a chat
// ready to send, but the coach still has to tap Send themselves, and a
// PDF can't be auto-attached this way (that also needs the Business API).
async function sendWhatsAppReminder(student) {
  if (!student.phone) { showToast('This student has no phone number on file.'); return; }
  const { data: coachMatch } = student.coach_id ? await sb.from('coaches').select('academy_name, academy_upi_id').eq('id', student.coach_id).maybeSingle() : { data: null };
  const academyName = coachMatch && coachMatch.academy_name ? coachMatch.academy_name : 'your academy';
  const fee = CATEGORIES[student.category].fee;
  const lines = [
    'Hi ' + student.name.split(' ')[0] + ',',
    'This is a reminder from ' + academyName + ' that your ' + student.category + ' fee of Rs. ' + fee.toLocaleString('en-IN') + ' is ' + (student.fee_status === 'OVERDUE' ? 'OVERDUE' : 'due') + (student.due_date ? ' (due ' + student.due_date + ')' : '') + '.',
  ];
  if (coachMatch && coachMatch.academy_upi_id) lines.push('You can pay directly via UPI to: ' + coachMatch.academy_upi_id);
  lines.push('Please clear this at your earliest convenience. Thank you!');
  const message = lines.join('\n');
  const digits = student.phone.replace(/[^0-9]/g, '');
  const withCountryCode = digits.length === 10 ? '91' + digits : digits;
  window.open('https://wa.me/' + withCountryCode + '?text=' + encodeURIComponent(message), '_blank');
}

// Attendance
async function markAttendance() {
  return withActionLock('markAttendance-' + state.me.id, async () => {
    const today = new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
    const alreadySynced = (state.cache.myAttendance || []).some((r) => r.requested_date === today && r.status === 'PENDING');
    const alreadyQueued = myOfflineAttendanceActions().some((a) => a.payload.requestedDate === today);
    if (alreadySynced || alreadyQueued) { showToast('You already have a pending request for today.'); return; }

    if (!state.isOnline || !sb) {
      queueOfflineAction('mark_attendance', { studentId: state.me.id, requestedDate: today });
      showToast(!sb ? 'Not connected — attendance saved on this device and will sync automatically once reconnected.' : 'You\'re offline — attendance saved on this device and will sync automatically once you\'re back online.', 'info');
      render();
      return;
    }

    try {
      const { error } = await sb.from('attendance_requests').insert({ student_id: state.me.id, requested_date: today, status: 'PENDING' });
      if (error) throw error;
      const { data } = await sb.from('attendance_requests').select('*').eq('student_id', state.me.id);
      state.cache.myAttendance = data || [];
      render();
    } catch (err) {
      queueOfflineAction('mark_attendance', { studentId: state.me.id, requestedDate: today });
      showToast('Could not reach the server — saved locally and it\'ll sync automatically.', 'info');
      render();
    }
  });
}
async function approveAttendance(reqId, approve) {
  if (isQueuedForSync(reqId)) { showToast('This decision is already queued to sync.'); return; }
  const status = approve ? 'APPROVED' : 'REJECTED';

  if (!state.isOnline || !sb) {
    queueOfflineAction('set_attendance_status', { reqId, status });
    showToast(!sb ? 'Not connected — decision saved on this device and will sync automatically once reconnected.' : 'You\'re offline — decision saved on this device and will sync automatically once you\'re back online.', 'info');
    render();
    return;
  }

  try {
    const { error } = await sb.from('attendance_requests').update({ status }).eq('id', reqId);
    if (error) throw error;
    await fetchAttendanceRequests();
    render();
  } catch (err) {

    showToast('Could not reach the server — saved locally and it\'ll sync automatically.', 'info');
    render();
  }
}

async function submitInventoryAdd() {
  const name = document.getElementById('invItemName').value.trim();
  const qty = parseInt(document.getElementById('invItemQty').value, 10);
  const price = parseFloat(document.getElementById('invItemPrice').value) || 0;
  if (!name) { showToast('Please enter an item name.'); return; }
  if (!qty || qty <= 0) { showToast('Please enter a quantity greater than 0.'); return; }
  const existing = state.cache.inventory.find((i) => i.name.trim().toLowerCase() === name.toLowerCase());
  if (existing) {
    const { error } = await sb.from('inventory_items').update({ quantity: existing.quantity + qty, unit_price: price || existing.unit_price, updated_at: new Date().toISOString() }).eq('id', existing.id);
    if (error) { showToast('Could not update inventory: ' + error.message); return; }
  } else {
    const { error } = await sb.from('inventory_items').insert({ coach_id: state.me.id, name, quantity: qty, unit_price: price });
    if (error) { showToast('Could not add item: ' + error.message); return; }
  }
  await fetchInventory(state.me.id);
  document.getElementById('invItemName').value = ''; document.getElementById('invItemQty').value = ''; document.getElementById('invItemPrice').value = '';
  render();
}

async function approveRequest(issueId) {
  return withActionLock('approveRequest-' + issueId, async () => {
    const req = (state.cache.itemRequests || []).find((r) => r.id === issueId);
    if (!req) return;
    const item = state.cache.inventory.find((i) => i.coach_id === state.me.id && i.name === req.item_name);
    if (!item || item.quantity < req.quantity) { showToast('Not enough stock to approve this — only ' + (item ? item.quantity : 0) + ' left.'); return; }
    await sb.from('inventory_items').update({ quantity: item.quantity - req.quantity }).eq('id', item.id);
    await sb.from('inventory_issues').update({ status: 'issued' }).eq('id', issueId);
    await Promise.all([fetchInventory(state.me.id), fetchItemRequests(state.me.id)]);
    render();
  });
}

async function submitEmailChange() {
  const oldEmail = document.getElementById('oldEmailInput').value.trim();
  const newEmail = document.getElementById('newEmailInput').value.trim();
  if (!oldEmail || !newEmail) { showToast('Please fill in both your current and new email.'); return; }
  const currentEmail = (state.session && state.session.user && state.session.user.email) || '';
  if (oldEmail.toLowerCase() !== currentEmail.toLowerCase()) { showToast('That doesn\'t match the email on your account.'); return; }
  if (!newEmail.includes('@')) { showToast('Please enter a valid new email address.'); return; }
  const { error } = await sb.auth.updateUser({ email: newEmail });
  if (error) { showToast('Could not update email: ' + error.message); return; }
  showToast('Check your inbox to confirm the email change.', 'success');
  state.accountForm = null; state.accountMenuOpen = false; render();
}
async function submitPasswordChange() {
  const oldPassword = document.getElementById('oldPasswordInput').value;
  const newPassword = document.getElementById('newPasswordInput').value;
  if (!oldPassword || !newPassword) { showToast('Please fill in both your current and new password.'); return; }
  if (newPassword.length < 6) { showToast('New password must be at least 6 characters.'); return; }
  const { error } = await sb.auth.updateUser({ password: newPassword, current_password: oldPassword });
  if (error) { showToast('Could not update password: ' + error.message); return; }
  showToast('Password updated.', 'success');
  state.accountForm = null; state.accountMenuOpen = false; render();
}
async function startNewAccount() {
  await logout();
  state.authTab = 'signup';
  render();

function computeAttendanceStreak(log) {
  let streak = 0;
  for (const entry of log) {
    if (entry.status === 'APPROVED') streak++;
    else break;
  }
  return streak;
}

async function addQualificationStandard() {
  if (!sb) { showToast('Not connected — please try again once you\'re back online.'); return; }
  const category = document.getElementById('qsCategory').value;
  const shots = Number(document.getElementById('qsShots').value);
  const mode = document.getElementById('qsMode').value;
  const tier = document.getElementById('qsTier').value;
  const cutoff = parseFloat(document.getElementById('qsCutoff').value);
  if (!cutoff || cutoff <= 0) { showToast('Please enter a valid cutoff score.'); return; }
  const { error } = await sb.from('qualification_standards').insert({ category, shots, mode, tier, cutoff_score: cutoff });
  if (error) { showToast('Could not add standard: ' + error.message); return; }
  document.getElementById('qsCutoff').value = '';
  await fetchQualificationStandards();
  render();
}
async function deleteQualificationStandard(id) {
  if (!sb) { showToast('Not connected — please try again once you\'re back online.'); return; }
  await sb.from('qualification_standards').delete().eq('id', id);
  await fetchQualificationStandards();
  render();
}

    '<div class="card" style="padding:0;overflow:hidden">' + (state.cache.invoices.length === 0 ? '<div style="padding:16px;font-size:12px;color:var(--paper-dim)">No payments recorded yet.</div>' :
    '<table class="ledger"><thead><tr><th>Invoice</th><th>Shooter</th><th>Amount</th><th>Method</th><th>Date</th></tr></thead><tbody>' +
    state.cache.invoices.map((i) => '<tr onclick="viewInvoice(' + i.id + ')"><td class="mono-sm">' + i.invoice_number + '</td><td style="font-weight:600">' + i.student_name + '</td><td>₹' + Number(i.amount).toLocaleString('en-IN') + '</td><td style="font-size:10.5px;color:var(--paper-dim)">' + i.method + '</td><td style="font-size:10.5px;color:var(--paper-dim)">' + new Date(i.paid_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) + '</td></tr>').join('') + '</tbody></table>') + '</div></div>' +
    '<div class="span-2"><div class="section-head"><span class="eyebrow">Fee structure</span></div><div class="fee-grid-2">' +
    Object.entries(CATEGORIES).map(([name, meta]) => '<div class="card fee-card">' + icon('target', 15, meta.color) + '<div style="flex:1"><div style="font-weight:600;font-size:12.5px">' + name + '</div><div style="font-size:10.5px;color:var(--paper-dim)">per month</div></div><div class="mono-lg" style="font-size:15px">₹' + meta.fee.toLocaleString('en-IN') + '</div></div>').join('') +
    '</div></div></div></div>' + (state.adminDetailId ? studentDetailModal() : '');
}

function screenLoading() {
  return '<div class="splash target-watermark" style="text-align:center"><div class="brand-center pulse-loading"><span class="brand-icon-ring">' + icon('crosshair', 36, 'var(--brass)') + '</span>' +
    '<div class="eyebrow" style="margin-top:14px">Loading…</div></div></div>';
}

function App() {
  let screenHtml;
  switch (state.screen) {
    case 'LOADING': screenHtml = screenLoading(); break;
    case 'AUTH': screenHtml = screenAuth(); break;
    case 'STUDENT_DASHBOARD': screenHtml = screenStudentDashboard(); break;
    case 'COACH_DASHBOARD': screenHtml = screenCoachDashboard(); break;
    case 'ADMIN_DASHBOARD': screenHtml = screenAdminDashboard(); break;
    default: screenHtml = screenAuth();
  }
  return toastBanner() + confirmDialogModal() + privacyNoticeModal() + screenHtml;
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
state.syncQueue = loadOfflineQueue();
setupInactivityMonitor();
loadFormDraft();
setupConnectivityListeners();
render();
try {
  boot().catch((err) => {
    document.getElementById('root').innerHTML =
      '<div class="screen-pad" style="text-align:center;padding-top:60px"><div class="eyebrow" style="color:var(--rust);margin-bottom:8px">Something went wrong on load</div>' +
      '<div style="font-size:12px;color:var(--paper-dim);margin-bottom:16px">' + (err && err.message ? err.message : String(err)) + '</div>' +
      '<button class="btn-brass" style="max-width:200px;margin:0 auto" onclick="location.reload()">Reload</button></div>';
  });
} catch (err) {
  document.getElementById('root').innerHTML =
    '<div class="screen-pad" style="text-align:center;padding-top:60px"><div class="eyebrow" style="color:var(--rust);margin-bottom:16px">Something went wrong on load</div>' +
    '<button class="btn-brass" style="max-width:200px;margin:0 auto" onclick="location.reload()">Reload</button></div>';
}
</script>
</body>
</html>
